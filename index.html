<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Friendly Tech Concierge provides patient in-home technology support, setup, troubleshooting, and lessons for seniors, families, and everyday users in the Las Vegas Valley." />
  <title>Friendly Tech Concierge | In-Home Tech Support in Las Vegas</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --navy: #102a43;
      --sky: #eaf4ff;
      --gold: #f4b942;
      --green: #16a34a;
      --text: #243447;
      --muted: #5f6f82;
      --soft: #f7fafc;
      --white: #ffffff;
      --border: #dbe5ef;
      --shadow: 0 18px 45px rgba(16, 42, 67, 0.12);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
      font-size: 18px;
    }

    a { color: inherit; }

    .container {
      width: min(1120px, 92%);
      margin: 0 auto;
    }

    .top-bar {
      background: var(--navy);
      color: white;
      font-size: 0.95rem;
      padding: 9px 0;
    }

    .top-bar .container {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    header {
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .nav {
      min-height: 86px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .brand img {
      height: 74px;
      width: auto;
      display: block;
    }

    .brand-text strong {
      display: block;
      color: var(--navy);
      font-size: 1.05rem;
    }

    .brand-text span {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 0.98rem;
      font-weight: 700;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      border: 2px solid transparent;
      transition: transform 0.15s ease, background 0.15s ease, border 0.15s ease;
    }

    .button:hover { transform: translateY(-1px); }

    .primary {
      background: var(--blue);
      color: white;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
    }

    .primary:hover { background: var(--blue-dark); }

    .secondary {
      background: white;
      color: var(--blue-dark);
      border-color: var(--border);
    }

    .hero {
      background: linear-gradient(135deg, #f7fbff 0%, #eaf4ff 55%, #ffffff 100%);
      padding: 74px 0 58px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      gap: 42px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: white;
      color: var(--blue-dark);
      font-weight: 800;
      font-size: 0.92rem;
      border: 1px solid var(--border);
    }

    h1, h2, h3 { line-height: 1.15; color: var(--navy); margin: 0 0 16px; }

    h1 {
      font-size: clamp(2.35rem, 5vw, 4.15rem);
      letter-spacing: -0.04em;
      margin-top: 20px;
    }

    h2 {
      font-size: clamp(1.9rem, 3.2vw, 2.75rem);
      letter-spacing: -0.025em;
    }

    h3 { font-size: 1.25rem; }

    .lead {
      font-size: 1.22rem;
      color: var(--muted);
      max-width: 680px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin: 24px 0;
    }

    .trust-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 28px;
    }

    .trust-item {
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--navy);
    }

    .hero-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .hero-card h2 { font-size: 1.7rem; }

    .check-list {
      list-style: none;
      margin: 20px 0 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .check-list li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .check-list li::before {
      content: "✓";
      color: white;
      background: var(--green);
      font-weight: 900;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 24px;
      font-size: 0.85rem;
      margin-top: 2px;
    }

    section { padding: 72px 0; }

    .section-intro {
      max-width: 760px;
      margin-bottom: 34px;
    }

    .muted { color: var(--muted); }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: 0 8px 22px rgba(16, 42, 67, 0.06);
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--sky);
      color: var(--blue-dark);
      font-size: 1.45rem;
      margin-bottom: 16px;
    }

    .soft { background: var(--soft); }

    .pricing-card {
      position: relative;
      overflow: hidden;
    }

    .price {
      font-size: 2.5rem;
      line-height: 1;
      font-weight: 900;
      color: var(--navy);
      margin: 10px 0 8px;
    }

    .badge {
      display: inline-block;
      background: #fff7df;
      color: #8a5c00;
      border: 1px solid #f3d37a;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .steps {
      counter-reset: step;
    }

    .step {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 16px;
      align-items: start;
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
    }
